  <div id="left-panel-stack">
  <!-- Data Layer Toggle Panel -->
  <div id="data-panel" class="panel-collapsible collapsed active" data-panel-id="data-panel">
    <div class="panel-glow"></div>
    <div class="data-panel-inner">
      <div class="panel-header">
        <span class="panel-title">数据图层</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="data-panel" title="收起面板">+</button>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
    </div>
  </div>

  <!-- CCTV Coverage Panel -->
  <div id="cctv-panel" class="panel-collapsible collapsed" data-panel-id="cctv-panel">
    <div class="panel-glow"></div>
    <div class="cctv-panel-inner" data-rail-scroller>
      <div class="panel-header">
        <span class="panel-title">监控摄像头</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="cctv-panel" title="收起面板">+</button>
      </div>
      <div class="cyber-panel-body" data-rail-scroller>
      <div id="cctv-frame-wrap" class="cctv-frame-wrap">
        <img id="cctv-frame" alt="CCTV feed frame" />
        <canvas id="cctv-video" class="cctv-frame" hidden></canvas>
      </div>
      <div id="cctv-source-badge" role="status" aria-live="polite">来源 · 未知</div>
      <div id="cctv-meta">启用监控摄像头以加载摄像头位置</div>
      <div class="cctv-controls">
        <button id="cctv-enable-btn" class="scene-btn">摄像头 关</button>
        <button id="cctv-nearest-btn" class="scene-btn">最近</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-prev-btn" class="scene-btn">上一个</button>
        <select id="cctv-camera-select" aria-label="监控摄像头"></select>
        <button id="cctv-next-btn" class="scene-btn">下一个</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-focus-btn" class="scene-btn">聚焦</button>
        <button id="cctv-coverage-btn" class="scene-btn">覆盖范围 关</button>
        <button id="cctv-auto-hop-btn" class="scene-btn">自动切换 关</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-projection-btn" class="scene-btn">投影 开</button>
        <span id="cctv-quality-chip">校准 · --</span>
      </div>
      <div class="cctv-calibration-block">
        <div class="cctv-calibration-header">
          <div class="cctv-summary-label">校准</div>
          <button id="cctv-adjust-btn" class="scene-btn" title="在世界中拖动摄像头：圆环旋转、箭头移动、手柄设置范围/视场角">调整</button>
        </div>
        <div id="cctv-cal-readout" class="cctv-cal-readout" aria-label="摄像头姿态 — 点击数值可输入">
          <button class="cctv-cal-value" data-cal-field="heading" title="航向角（罗盘°）— 点击输入">航向 --</button>
          <button class="cctv-cal-value" data-cal-field="pitch" title="俯仰角（° 上/下）— 点击输入">俯仰 --</button>
          <button class="cctv-cal-value" data-cal-field="fov" title="水平视场角（°）— 点击输入">视场角 --</button>
          <button class="cctv-cal-value" data-cal-field="range" title="范围 / 监控平面距离（米）— 点击输入">范围 --</button>
          <button class="cctv-cal-value" data-cal-field="height" title="安装高度（距地 米）— 点击输入">高度 --</button>
          <button class="cctv-cal-value" data-cal-field="north" title="相对目录位置北偏移（米）— 点击输入">北偏 --</button>
          <button class="cctv-cal-value" data-cal-field="east" title="相对目录位置东偏移（米）— 点击输入">东偏 --</button>
        </div>
        <div class="cctv-controls cctv-calibration-actions">
          <button id="cctv-calib-save-btn" class="scene-btn">保存校准</button>
          <button id="cctv-calib-reset-btn" class="scene-btn">重置校准</button>
        </div>
      </div>
      <div class="cctv-summary-label">场景摘要</div>
      <div id="cctv-summary">启用监控摄像头以开始摄像头关联的情报摘要。</div>
      </div>
    </div>
  </div>

  <!-- Street Level Panel (moved into #right-context-rail at runtime) -->
  <div id="street-level-panel" class="panel-collapsible collapsed" data-panel-id="street-level-panel">
    <div class="panel-glow"></div>
    <div class="street-level-panel-inner" data-rail-scroller>
      <div class="panel-header">
        <span class="panel-title">街景</span>
        <span class="panel-divider"></span>
        <button id="sl-status" class="sl-status" type="button" aria-pressed="false" title="开关街景">关</button>
        <button class="panel-collapse-btn" data-collapse-target="street-level-panel" title="展开面板">◀</button>
      </div>
      <div id="sl-body" class="sl-body">
        <div class="sl-main">
          <div id="sl-viewer-wrap" class="sl-viewer-wrap" hidden>
            <div class="sl-viewer-bar">
              <div class="sl-viewer-tools">
                <button id="sl-viewer-expand" class="scene-btn" type="button" aria-pressed="false" title="展开街景视图（Esc 缩小）"><span class="sl-btn-icon" aria-hidden="true">⤢</span><span class="sl-btn-text">展开</span></button>
                <div class="sl-seg" role="radiogroup" aria-label="图片适配">
                  <button type="button" class="sl-seg-btn is-active" data-sl-render="letterbox" role="radio" aria-checked="true" title="适配：显示整张照片，形状不同处留黑边">适应</button>
                  <button type="button" class="sl-seg-btn" data-sl-render="fill" role="radio" aria-checked="false" tabindex="-1" title="填充：铺满整个画面，裁剪照片">填充</button>
                </div>
                <button id="sl-follow-btn" class="scene-btn" type="button" aria-pressed="false" aria-label="摄像头跟随视角" title="摄像头跟随视角：地球摄像头跟随街景视角移动"><span class="sl-btn-icon" aria-hidden="true">⌖</span><span class="sl-btn-text">跟随</span></button>
              </div>
              <div class="sl-viewer-tools sl-viewer-tools-right">
                <button id="sl-viewer-close" class="sl-viewer-x" type="button" title="Close the image and deselect it on the map" aria-label="Close the street-level image">×</button>
              </div>
            </div>
            <div class="sl-viewer-stage">
              <div id="sl-viewer-placeholder" class="sl-viewer-placeholder" hidden></div>
              <div id="sl-viewer" class="sl-viewer" aria-label="Street-level viewer"></div>
            </div>
            <div id="sl-image-meta" class="sl-image-meta">
              <span id="sl-image-by" class="sl-image-by"></span>
              <span class="sl-image-right">
                <span id="sl-image-when" class="sl-image-when"></span>
                <a id="sl-image-link" class="sl-image-link" href="#" target="_blank" rel="noopener noreferrer" title="Open this image on the provider's site" hidden></a>
              </span>
            </div>
          </div>
          <div class="sl-settings">
            <div class="sl-providers" role="group" aria-label="Imagery providers">
              <span class="cctv-summary-label">图源</span>
              <div id="sl-provider-chips" class="sl-chips"></div>
            </div>
            <div id="sl-error" class="sl-error" role="alert" hidden><span aria-hidden="true">⚠</span> <span id="sl-error-text"></span></div>
            <!-- A missing key gates the filters only: the chips above stay
                 focusable so their tooltip can say how to add the key. -->
            <fieldset id="sl-controls" class="sl-controls">
              <div class="sl-filters" role="group" aria-label="Imagery filters">
                <span class="cctv-summary-label">影像</span>
                <div class="sl-seg" role="radiogroup" aria-label="全景图筛选">
                  <button type="button" class="sl-seg-btn is-active" data-sl-pano="all" role="radio" aria-checked="true">全部</button>
                  <button type="button" class="sl-seg-btn" data-sl-pano="pano" role="radio" aria-checked="false" tabindex="-1">360°</button>
                  <button type="button" class="sl-seg-btn" data-sl-pano="flat" role="radio" aria-checked="false" tabindex="-1">平面</button>
                </div>
              </div>
              <div class="sl-since">
                <label class="cctv-summary-label" for="sl-since">时间</label>
                <input id="sl-since" class="sl-range" type="range" min="0" max="8" step="1" value="0" aria-valuetext="任意日期" aria-describedby="sl-since-label" />
                <output id="sl-since-label" class="sl-since-label" for="sl-since">任意日期</output>
              </div>
            </fieldset>
            <ul id="sl-legend" class="sl-legend" aria-label="Coverage colours"></ul>
            <div id="sl-coverage-meta" class="sl-meta"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scene Director Panel -->
  <div id="scene-panel" class="panel-collapsible collapsed" data-panel-id="scene-panel">
    <div class="panel-glow"></div>
    <div class="scene-panel-inner">
      <div class="panel-header">
        <span class="panel-title">场景</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="scene-panel" title="收起面板">+</button>
      </div>
      <div class="scene-controls">
        <select id="scene-select" aria-label="场景预设"></select>
        <button id="scene-new-btn" class="scene-btn">新建</button>
        <button id="scene-delete-btn" class="scene-btn scene-btn-danger">删除</button>
      </div>
      <div class="scene-controls">
        <button id="scene-capture-btn" class="scene-btn">截取画面</button>
        <button id="scene-update-shot-btn" class="scene-btn">更新画面</button>
      </div>
      <div id="scene-shot-list" class="scene-shot-list"></div>
      <div class="scene-controls">
        <button id="scene-start-btn" class="scene-btn">开始</button>
        <button id="scene-stop-btn" class="scene-btn scene-btn-danger">停止</button>
        <button id="scene-next-btn" class="scene-btn">下一个</button>
      </div>
      <div class="scene-controls">
        <button id="scene-export-btn" class="scene-btn">导出预设</button>
        <button id="scene-import-btn" class="scene-btn">导入</button>
        <button id="scene-download-btn" class="scene-btn">运行日志</button>
        <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
      </div>
      <div class="scene-progress">
        <div id="scene-progress-fill">0%</div>
      </div>
      <div id="scene-status">就绪</div>
    </div>
  </div>

  </div>
